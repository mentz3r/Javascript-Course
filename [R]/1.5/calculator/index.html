<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div class="calculator__box">
        <input class="js__calc__result display__result" readonly>
        <div class="buttons__container">
            <p>
                <button class="calculation__btn operation__btn">+</button>
                <button class="calculation__btn">1</button>
                <button class="calculation__btn">2</button>
                <button class="calculation__btn">3</button>
            </p>
            <p>
                <button class="calculation__btn operation__btn">-</button>
                <button class="calculation__btn">4</button>
                <button class="calculation__btn">5</button>
                <button class="calculation__btn">6</button>
            </p>
            <p>
                <button class="calculation__btn operation__btn">*</button>
                <button class="calculation__btn">7</button>
                <button class="calculation__btn">8</button>
                <button class="calculation__btn">9</button>
            </p>
            <p>
                <button class="calculation__btn operation__btn">/</button>
                <button class="calculation__btn">0</button>
                <button class="calculation__btn">.</button>
                <button class="calculation__btn">=</button>
                <button class="calculation__btn operation__btn clear">C</button>
            </p>
        </div>
    </div>
    <script src="calculator.js"></script>
</body>
</html>
