<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game: Rock, Papper, Scissors</title>
</head>
<body>
    <h1>Let's try to play Rock, Papper, Scissors !</h1>
    <div class="game__box">
        <div class="container">
            <h2 class="score">Your score will be there !</h2>
            <div class="player__choice">
                <p class="player__text">Please, choose your step</p>
                <button class="move__btn rock">ROCK</button>
                <button class="move__btn paper">PAPPER</button>
                <button class="move__btn scissors">SCISSORS</button>
            </div>
            <div class="game__func">
                <button class="clear__btn">Reset score</button>
            </div>
            <div class="results__box">
                <p class="choice__of__two"></p>
                <p class="result__of__battle"></p>
            </div>
        </div>
    </div>

    <script src="RPS.js"></script>
</body>
</html>
