<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My TodoList</title>
    <link rel="stylesheet" href="T-22-10-26.css">
</head>
<body>
    <div class="todo__window">
        <h1 class="main__title">Todo List</h1>
        <div class="input__group">
            <input class="input__item" type="text" placeholder="Add your new todo !">
            <input class="input__date" type="date">
            <button class="add__btn""></button>
        </div>
        <p>Todo task</p>
        <p class="todo__item"></p>
        <button class="clear__btn">Clear All</button>
    </div>
    <script src="T-22-10-26.js"></script>
</body>
</html>
