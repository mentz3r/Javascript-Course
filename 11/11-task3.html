        function findIndex(array, word) {
            let firstIndex = -1;

            for (let i = 0; i < array.length; ++i) {
                if (array[i] === word) {
                    firstIndex = i;
                    break
                }
            }

            return firstIndex;
        }

        console.log(findIndex(['green', 'red', 'blue', 'red'], 'red'));

        function removeEgg(foods) {
            const newFoods = [];
            let eggsRemoved = 0;

            for (let i = 0; i < foods.length; ++i) {
                if (foods[i] === 'egg' && eggsRemoved < 2) {eggsRemoved++; continue;}
                else {newFoods.push(foods[i])}
            }

            return newFoods;
        }

        console.log(removeEgg(['egg', 'apple', 'egg', 'egg', 'ham']))

        // 11t-11u

        function removeEgg(foods) {
            const copyFoods = foods.slice();
            const reversedArray = copyFoods.reverse();
            const result = [];
            let eggsRemoved = 0;

            for (let i = 0; i < reversedArray.length; ++i) {
                if (reversedArray[i] === 'egg' && eggsRemoved < 2) {eggsRemoved++; continue;}
                result.push(reversedArray[i]);
            }

            return result.reverse();
        }

        const foods = ['egg', 'apple', 'egg', 'egg', 'ham'];
        console.log(removeEgg(foods));

        function findIndex(array, word) {
            let firstIndex = -1;

            for (let i = 0; i < array.length; ++i) {
                if (array[i] === word) {
                    firstIndex = i;
                    break
                }
            }

            return firstIndex;
        }

        function unique(array) {

            const uniqueArray = [];

            for (let i = 0; i < array.length; ++i) {
                const value = array[i];

                if (findIndex(uniqueArray, value) === -1) {uniqueArray.push(value);}
                else {continue;}
            }

            return uniqueArray;
        }
