        function minMax(nums) {

            const result = {
                minEl: null,
                maxEl: null
            };

            for (let i = 0; i < nums.length; ++i) {
                if (result.minEl === null || nums[i] < result.minEl) {result.minEl = nums[i]}
                if (result.maxEl === null || nums[i] > result.maxEl) {result.maxEl = nums[i]}
            }

            return result;
        }

        console.log(minMax([1, -3, 5]));
        console.log(minMax([-2, 3, -5, 7, 10]));
        console.log(minMax([]));
        console.log(minMax([3]));

        // 11n

        function countWords(words) {
            const result = {};

            for (let i = 0; i < words.length; ++i) {
                const key = words[i];
                if (!result[key]) {result[key] = 1}
                else {result[key]++}
            }

            return result;
        }

        console.log(countWords(['apple', 'grape', 'apple', 'apple', 'pineapple', 'watermelon']));
