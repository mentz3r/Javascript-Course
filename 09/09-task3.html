<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input class="js-input" type="text" placeholder="Type something" onkeyup="autoDuplicate(event);">
    <p class="js-output"></p>

    <script>
        function autoDuplicate(event) {
            const inputSymb = document.querySelector('.js-input').value;
            document.querySelector('.js-output')
                .innerHTML = inputSymb;
        }
    </script>
</body>
</html>
