<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Amazon Shipping Calculator</p>
    <input class="js-cost-input" type="text" placeholder="Cost of order" onkeydown="handleCostKeydown(event)">
    <button onclick="calculateTotal()">Calculate</button>
    <p class="js-total-cost"></p>

    <script>
        function handleCostKeydown(event) {
            if (event.key === 'Enter') {
                calculateTotal();
            }
        }

        function calculateTotal() {
            let value = Number(document.querySelector('.js-cost-input').value) * 100;

            if (value < 4000) {
                document.querySelector('.js-total-cost').innerHTML = '$' + (value + 1000) / 100;
            } else {
                document.querySelector('.js-total-cost').innerHTML = '$' + (value / 100);
            }
        }
            
    </script>
</body>
</html>
