<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button>9a</button>
    <button class="js-button">9b</button>
    <p></p>
    <button onclick="playerChoice('heads')">heads</button>
    <button onclick="playerChoice('tails')">tails</button>
    <p class="js-choice"></p>

    <input class="js-input" type="text" placeholder="Name" onkeydown="handleCostKeydown(event)">
    <button onclick="userName()">Submit</button>
    <p class="js-name"></p>

    <script>
        console.log(document.querySelector('button'));
        document.querySelector('.js-button').innerHTML = '9b done!';

        function playerChoice(value) {
            document.querySelector('.js-choice').innerHTML = `You chose: ${value}`;
        }

        function userName() {
            const name = document.querySelector('.js-input').value;
            document.querySelector('.js-name').innerHTML = `Your name is: ${name}`
        }

        function handleCostKeydown(event) {
            if (event.key === 'Enter') {
                userName();
            }
        }
    </script>
</body>
</html>
