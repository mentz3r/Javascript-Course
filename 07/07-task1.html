<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 7a - 7c
        function greet(name) {
            console.log((!name) ? `Hello there!` : `Hello, ${name}`);
        }

        greet()
        greet('Arseniy');
        greet('Egor');
        greet('Artem');

        //7d
        function convertToFahrenheit(celsius) {
            const fahrenheit = (celsius * 9 / 5) + 32;
            
            return fahrenheit;
        }

        console.log(convertToFahrenheit(25));

        // 7e
        function convertToCelsius(fahrenheit) {
            return (fahrenheit - 32) * 5 / 9;
        }

        console.log(convertToCelsius(86));

        // 7f
        function convertTemperature(degrees, unit) {
            let result = '';

            if (unit === 'C') {
                result = convertToFahrenheit(degrees);
            } else if (unit === 'F') {
                result = convertToCelsius(degrees);
            }

            return (unit === 'F') ? `${result}C` : `${result}F`;
        }

        console.log(convertTemperature(25, 'C'));
        console.log(convertTemperature(86, 'F'));

        // 7g - 7i
        function convertLength(length, from, to) {

            const validUnit = ['km', 'miles', 'ft']

            if (!validUnit.includes(from) && !validUnit.includes(to)) { return `Invalid unit: ${to}`}
            if (from === to) { return `${length} ${to}`; }

            else if (from === 'km') {
                if (to === 'miles') { return `${length / 1.6} ${to}`; }
                else if (to === 'ft') { return `${length * 3281} ${to}`;}

            } else if (from === 'miles') {
                if (to === 'km') {return `${length * 1.6} ${to}`;}
                else if (to === 'ft') { return `${length * 5280} ${to}`; }

            } else if (from === 'ft') {
                if (to === 'km') {return `${length / 3281} ${to}`;}
                else if (to === 'miles') {return `${length / 5280} ${to}`;}
                
            }
        }

        console.log(convertLength(50, 'miles', 'km'));
        console.log(convertLength(32, 'km', 'miles'));
        console.log(convertLength(50, 'km', 'km'));
        console.log(convertLength(5, 'miles', 'km'));
        console.log(convertLength(5, 'miles', 'ft'));
        console.log(convertLength(5, 'km', 'ft'));
        console.log(convertLength(5, 'lbs', 'lbs'));



    </script>
</body>
</html>
