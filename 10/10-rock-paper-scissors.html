<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="/10/css/10-rps.css">
</head>

<body>
    <div class="container">
        <div class="cotainer-inner">
            <h1 class="title">Rock Paper Scissors</h1>
            <button onclick="
                playGame('rock');
            " class="move-button"><img src="/10/images/rock-emoji.png" class="move-icon"></button>

            <button onclick="
                playGame('paper');
            " class="move-button"><img src="/10/images/paper-emoji.png" class="move-icon"></button>

            <button onclick="
                playGame('scissors');
            " class="move-button"><img src="/10/images/scissors-emoji.png" class="move-icon"></button>

            <p class="js-result result"></p>

            <p class="js-moves moves"></p>

            <p class="js-score score"></p>

            <button onclick="score.wins = 0; score.losses = 0; score.ties = 0; localStorage.removeItem('score'); updateScoreElement()" class="reset-button">Reset Score</button>
        </div>
    </div>

    <script src="/10/js/10-rps.js"></script>
</body>

</html>
