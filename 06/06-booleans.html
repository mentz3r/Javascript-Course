        /*
        if (0) {
            console.log('truthy');
        } else {
            console.log('falsy');
        }

        // Falsy Values: false; 0; NaN; undefined; null.
        // Any value not on this list is truthy.

        const result = true ? 'truthy' : 'falsy';
        console.log(result); // Ternary Operator

        const message = 5 && 'hello';
        console.log(message); // Guard Operator

        const currency = undefined || 'USD';
        console.log(currency); // Default Operator

        // То же самое, что Default, но дает возможность
        // Сделать 0 допустимым значением
        const count = 0;
        console.log(count ?? 10)

        const user = {name: "Anna"};
        console.log(user.address.city); // Выдаст TypeError. address --> undefiend; undefiend.city --> TypeError
        console.log(user.address?.city); // Выдаст undefiend. ?. проверит значение address, и если оно undefiend или null, то остановится на нем же.

        const user2 = {name: 'Arkadiy', address: {city: 'Berlin'}}
        console.log(user2.address?.city);
