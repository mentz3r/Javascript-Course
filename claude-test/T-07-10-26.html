        function handleInput(event) {
            if (event.key === 'Enter') {
                calculateTax();
            }
        }

        function calculateTax() {

            let value = Number(document.querySelector('.js-input').value);
            
            if (!value || value < 0) {
                document.querySelector('.js-text')
            .innerHTML = 'Invalid value.';
            }
            else {
                document.querySelector('.js-text')
            .innerHTML = `Total: $${(1.19*value).toFixed(2)}`;}
        }

        // 8

        function subscribe() {
            const buttonElement = document.querySelector('.js-btn_sub');

            if (buttonElement.innerText === 'Subscribe') {
                buttonElement.innerHTML = 'Subscribed';
            } else {
                buttonElement.innerHTML = 'Subscribe';
            }
        }
